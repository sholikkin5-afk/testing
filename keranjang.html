<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - SARAHmart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:#f0f7ff;padding:20px}
    .container{max-width:600px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 5px 20px rgba(25,118,210,0.1)}
    .header-keranjang{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .btn-back{background:#1976d2;color:white;border:none;padding:8px 15px;border-radius:10px;cursor:pointer}
    .item-cart{display:flex;gap:12px;margin-bottom:12px;padding:12px;background:#f8fafc;border-radius:14px;border:1px solid #e2e8f0}
    .item-cart img{width:70px;height:70px;object-fit:cover;border-radius:10px}
    .qty-btn{display:flex;align-items:center;gap:4px;margin-top:6px}
    .qty-btn button{width:28px;height:28px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;font-weight:bold;cursor:pointer}
    .qty-input{width:40px;height:28px;text-align:center;border:1px solid #cbd5e1;border-radius:6px}
    .total-bar{background:#f0f7ff;padding:16px;border-radius:14px;margin:16px 0}
    .total-detail{display:flex;justify-content:space-between;margin:5px 0}
    .form-pelanggan input, .form-pelanggan textarea{width:100%;padding:10px 12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px}
    .btn-wa{width:100%;background:linear-gradient(135deg, #25D366 0%, #128C7E 100%);color:white;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
    .btn-hapus{color:#ef4444;border:none;background:none;cursor:pointer;margin-top:6px}
  </style>
</head>
<body>
  <div class="container">
    <div class="header-keranjang">
      <h2>🛒 Keranjang Belanja</h2>
      <button class="btn-back" onclick="window.location.href='sarahmart.html'">← Kembali Belanja</button>
    </div>

    <div id="isi-keranjang">Loading...</div>
    <div id="rincian-total"></div>

    <div class="form-pelanggan">
      <h4>Data Pengiriman</h4>
      <input type="text" id="nama_pelanggan" placeholder="Nama Lengkap" readonly>
      <input type="text" id="no_hp" placeholder="No HP 08xxxx" readonly>
      <textarea id="alamat" placeholder="Alamat Lengkap" rows="3" readonly></textarea>
      <p style="font-size:12px;color:#666">*Data diambil dari Profil. Ganti neng sarahmart.html > Profil</p>
    </div>

    <button class="btn-wa" onclick="kirimPesanan()">💬 Kirim Pesanan via WhatsApp</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK';
    const ADMIN_WA = '6281328282446';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let keranjang = []; let produk = []; let dataProfil = null;
    let BIAYA_LAYAN = 2000; let ONGKIR_DEFAULT = 2000;

    document.addEventListener('DOMContentLoaded', async () => {
      keranjang = JSON.parse(localStorage.getItem('keranjang_sarahmart')) || [];
      await loadProduk();
      await loadProfil();
      tampilKeranjang();
    });

    async function loadProduk(){
      const {data} = await db.from('prodak').select('*');
      produk = data || [];
    }

    async function loadProfil(){
      const { data: { user } } = await db.auth.getUser();
      if(!user) return window.location.href = 'index.html';
      const {data} = await db.from('profiles').select('*').eq('id', user.id).single();
      dataProfil = data;
      if(data){
        document.getElementById('nama_pelanggan').value = data.nama_lengkap;
        document.getElementById('no_hp').value = data.no_wa;
        document.getElementById('alamat').value = `Jalan: ${data.jalan}\nDesa: ${data.desa}\nKecamatan: ${data.kecamatan}\nKabupaten: ${data.kabupaten}`;
      }
    }

    function tampilKeranjang(){
      const container = document.getElementById('isi-keranjang');
      const rincianEl = document.getElementById('rincian-total');
      if(keranjang.length === 0){
        container.innerHTML = "<p style='text-align:center;color:#666'>Keranjang masih kosong</p>";
        rincianEl.innerHTML = "";
        return;
      }
      container.innerHTML = "";
      let totalBelanja = 0;
      keranjang.forEach((k)=>{
        totalBelanja += k.harga * k.jumlah;
        const produkAsli = produk.find(p => p.id === k.id);
        container.innerHTML += `<div class="item-cart">
          <img src="${k.gambar_url}">
          <div style="flex:1">
            <h4>${k.nama}</h4>
            <p style="color:#00c853;font-weight:bold">Rp ${k.harga.toLocaleString('id-ID')}</p>
            <div class="qty-btn">
              <button onclick="ubahJumlah(${k.id},'kurang')">-</button>
              <input type="number" class="qty-input" value="${k.jumlah}" onchange="setJumlah(${k.id}, this.value)">
              <button onclick="ubahJumlah(${k.id},'tambah')">+</button>
            </div>
            <button class="btn-hapus" onclick="hapusItem(${k.id})">🗑️ Hapus</button>
          </div>
        </div>`;
      });
      let ongkir = ONGKIR_DEFAULT;
      let biayaLay = BIAYA_LAYAN;
      let totalAkhir = totalBelanja + ongkir + biayaLay;
      rincianEl.innerHTML = `<div class="total-bar">
        <div class="total-detail"><span>Subtotal</span><span>Rp ${totalBelanja.toLocaleString('id-ID')}</span></div>
        <div class="total-detail"><span>Ongkir</span><span>Rp ${ongkir.toLocaleString('id-ID')}</span></div>
        <div class="total-detail"><span>Biaya Layanan</span><span>Rp ${biayaLay.toLocaleString('id-ID')}</span></div>
        <div class="total-detail" style="font-weight:bold;border-top:1px dashed #1976d2;padding-top:8px"><span>TOTAL</span><span>Rp ${totalAkhir.toLocaleString('id-ID')}</span></div>
      </div>`;
    }

    function ubahJumlah(id, aksi){
      const item = keranjang.find(x=>x.id === id);
      if(aksi === 'tambah'){item.jumlah++}
      if(aksi === 'kurang'){item.jumlah--}
      if(item.jumlah <= 0){keranjang = keranjang.filter(x=>x.id!== id)}
      simpanDanRender();
    }

    function setJumlah(id, val){ keranjang.find(x=>x.id === id).jumlah = parseInt(val) || 1; simpanDanRender(); }
    function hapusItem(id){ keranjang = keranjang.filter(x=>x.id!== id); simpanDanRender(); }
    function simpanDanRender(){ localStorage.setItem('keranjang_sarahmart', JSON.stringify(keranjang)); tampilKeranjang(); }

    async function kirimPesanan(){
      if(keranjang.length===0){alert("Keranjang kosong!"); return;}
      if(!dataProfil){alert("Lengkapi profil dulu!"); return;}
      
      let totalBelanja = keranjang.reduce((a,b)=>a+b.harga*b.jumlah,0);
      let totalAkhir = totalBelanja + ONGKIR_DEFAULT + BIAYA_LAYAN;
      const id_pesanan = 'SRH' + Date.now();

      const {error} = await db.from('pesenan').insert([{
        id_pesanan: id_pesanan, data_keranjang: keranjang, nama_pelanggan: dataProfil.nama_lengkap,
        no_hp: dataProfil.no_wa, alamat: dataProfil.jalan, total_harga: totalAkhir, status: 'Baru'
      }]);
      if(error){alert('Gagal: '+error.message); return;}

      let pesanAdmin = `🔔 PESAN BARU! 🔔%0AID: ${id_pesanan}%0A`;
      keranjang.forEach(k=>{pesanAdmin += `- ${k.nama} x${k.jumlah}%0A`;});
      pesanAdmin += `%0ATOTAL: Rp ${totalAkhir.toLocaleString('id-ID')}%0A%0ADari: ${dataProfil.nama_lengkap}`;
      window.open(`https://wa.me/${ADMIN_WA}?text=${pesanAdmin}`, '_blank');
      
      localStorage.removeItem('keranjang_sarahmart'); // KOSONGNO KERANJANG
      alert('Pesanan terkirim!');
      window.location.href = 'sarahmart.html';
    }
  </script>
</body>
</html>
