<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk - SARAHmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body{background:linear-gradient(135deg, #f0fdfa 0%, #f5f3ff 100%);}
   .btn-beli{background:linear-gradient(135deg, #0d9488 0%, #8b5cf6 100%)}
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="bg-gradient-to-r from-ijo-tosca-700 to-ungu-mewah-700 text-white p-4 flex items-center gap-3 sticky top-0 z-10">
    <button onclick="history.back()" class="text-2xl">←</button>
    <h1 class="font-bold text-lg">Detail Produk</h1>
  </header>

  <!-- LOADING -->
  <div id="loading" class="text-center p-10">Loading...</div>

  <!-- KONTEN DETAIL -->
  <div id="konten-detail" class="hidden max-w-2xl mx-auto p-4">
    <img id="gambar-produk" src="" class="w-full h-80 object-cover rounded-2xl shadow-lg mb-4">
    
    <div class="bg-white p-5 rounded-2xl shadow-md">
      <div id="badge-wrap" class="flex gap-2 mb-2"></div>
      <h2 id="nama-produk" class="text-2xl font-bold text-ijo-tosca-800 mb-2"></h2>
      
      <div id="harga-wrap" class="mb-3"></div>
      
      <p id="stok-produk" class="text-sm text-slate-600 mb-4"></p>
      <p id="kategori-produk" class="text-sm text-slate-500 mb-4"></p>

      <div class="flex gap-3">
        <div class="flex items-center border-2 border-slate-200 rounded-xl">
          <button onclick="kurangQty()" class="px-4 py-2 font-bold">-</button>
          <span id="qty" class="px-4 font-bold">1</span>
          <button onclick="tambahQty()" class="px-4 py-2 font-bold">+</button>
        </div>
        <button id="btn-tambah-keranjang" onclick="tambahKeKeranjang()" class="flex-1 btn-beli text-white font-bold py-3 rounded-xl">+ Tambah ke Keranjang</button>
      </div>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-md mt-4">
      <h3 class="font-bold text-lg mb-2 text-ijo-tosca-700">Deskripsi Produk</h3>
      <p id="deskripsi-produk" class="text-slate-600"></p>
    </div>
  </div>

  <script>
    const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    let produkDetail = {};
    let qty = 1;

    document.addEventListener('DOMContentLoaded', loadDetail);

    async function loadDetail(){
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if(!id) return window.location.href = 'sarahmart.html';

      const {data} = await db.from('prodak').select('*').eq('id', id).single();
      if(!data) return window.location.href = 'sarahmart.html';

      produkDetail = data;
      tampilkanDetail();
    }

    function tampilkanDetail(){
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('konten-detail').classList.remove('hidden');

      const p = produkDetail;
      const today = new Date().toISOString().split('T')[0];
      let diskonAktif = p.diskon > 0 && (!p.tgl_kadaluarsa || p.tgl_kadaluarsa >= today);
      let hargaFinal = diskonAktif? Math.round(p.harga - (p.harga * p.diskon / 100)) : p.harga;

      document.getElementById('gambar-produk').src = p.gambar_url;
      document.getElementById('nama-produk').innerText = p.nama;
      document.getElementById('deskripsi-produk').innerText = p.deskripsi || 'Tidak ada deskripsi';
      document.getElementById('kategori-produk').innerText = `Kategori: ${p.deskripsi || '-'}`;
      document.getElementById('stok-produk').innerText = p.stok > 0? `Stok: ${p.stok}` : 'STOK HABIS';

      // Harga
      let htmlHarga = `<span class="text-3xl font-bold text-ijo-tosca-600">Rp ${hargaFinal.toLocaleString('id-ID')}</span>`;
      if(diskonAktif){
        htmlHarga += `<span class="line-through text-slate-400 ml-2">Rp ${p.harga.toLocaleString('id-ID')}</span>`;
        document.getElementById('badge-wrap').innerHTML = `<span class="bg-pink-500 text-white px-3 py-1 rounded-lg text-sm font-bold">-${p.diskon}%</span>`;
      }
      document.getElementById('harga-wrap').innerHTML = htmlHarga;

      // Cek stok
      if(p.stok <= 0){
        document.getElementById('btn-tambah-keranjang').disabled = true;
        document.getElementById('btn-tambah-keranjang').innerText = 'STOK HABIS';
        document.getElementById('btn-tambah-keranjang').classList.add('bg-gray-400');
      }
    }

    function tambahQty(){
      if(qty < produkDetail.stok) qty++;
      document.getElementById('qty').innerText = qty;
    }
    function kurangQty(){
      if(qty > 1) qty--;
      document.getElementById('qty').innerText = qty;
    }

    function tambahKeKeranjang(){
      let keranjang = JSON.parse(localStorage.getItem('keranjang_sarahmart')) || [];
      const item = keranjang.find(x => x.id === produkDetail.id);
      if(item){
        if(item.jumlah + qty > produkDetail.stok) return alert('Stok tidak cukup!');
        item.jumlah += qty;
      } else {
        keranjang.push({...produkDetail, harga: Math.round(produkDetail.harga - (produkDetail.harga * produkDetail.diskon / 100)), jumlah: qty});
      }
      localStorage.setItem('keranjang_sarahmart', JSON.stringify(keranjang));
      alert(`${qty} ${produkDetail.nama} ditambahkan ke keranjang!`);
      window.location.href = 'keranjang.html';
    }
  </script>
</body>
</html>
