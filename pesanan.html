<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Pesanan Saya - SARAHmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script> 
</head>
<body class="bg-[#f0fdf4] min-h-screen">
  <div class="max-w-2xl mx-auto p-4">
    
    <div class="flex items-center justify-between mb-5">
      <button onclick="window.location.href='index.html'" class="bg-white px-4 py-2 rounded-xl shadow-md text-[#16a34a] font-bold flex items-center gap-2 hover:bg-green-50">
        ← Kembali
      </button>
      <h3 class="text-xl font-bold text-[#15803d]">📦 Riwayat Pesanan</h3>
    </div>

    <div id="list-pesanan" class="space-y-4">
      <p class="text-center text-gray-500 py-10">Loading data pesanan...</p>
    </div>
  </div>

  <script>
    const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const ADMIN_WA = '6281328282446';
    
    let dataProfil = null;
    let semuaPesanan = []; // TAMBAH IKI BEN ISO GOLEK DATA

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user }} = await db.auth.getUser();
      if(!user) return window.location.href = 'index.html';
      
      const {data, error} = await db.from('profiles').select('*').eq('id', user.id).single();
      if(error){ console.log(error); return; }
      
      dataProfil = data;
      if(!data || !data.nama_lengkap || !data.no_wa){
        alert('Lengkapi profil dulu di halaman utama');
        window.location.href = 'index.html';
      } else {
        loadPesanan();
      }
    });

    async function loadPesanan(){
      if(!dataProfil) return;
      const hp = dataProfil.no_wa;
      const container = document.getElementById('list-pesanan');
      container.innerHTML = '<p class="text-center text-gray-500 py-10">Loading...</p>';
      
      const {data, error} = await db.from('pesenan').select('*').eq('no_hp', hp).order('created_at', {ascending:false});
      
      if(error){
        container.innerHTML = `<p class="text-red-500 text-center">Error: ${error.message}</p>`; 
        return;
      }
      
      semuaPesanan = data || []; // SIMPEN DATA NE

      if(!data || data.length == 0){
        container.innerHTML = '<p class="text-center text-gray-500 py-10">😅 Belum ada pesanan</p>';
        return;
      }
      
      container.innerHTML = '';
      data.forEach(p => {
        let statusClass = p.status == 'Baru' ? 'bg-orange-500' : p.status == 'Proses' ? 'bg-blue-500' : p.status == 'Selesai' ? 'bg-green-500' : 'bg-red-500';
        let detailHTML = '';
        
        let items = [];
        try {
          items = typeof p.data_keranjang === 'string' ? JSON.parse(p.data_keranjang) : p.data_keranjang;
        } catch(e){ console.log("Gagal parse data_keranjang", e) }

        if(items && items.length > 0){
          detailHTML = `<div class="mt-3 pt-3 border-t border-dashed border-green-100"><p class="font-semibold text-sm mb-2">Detail Pesanan:</p>`;
          items.forEach(i => {
            let subtotal = i.harga * i.jumlah;
            detailHTML += `
              <div class="flex gap-3 items-center mb-2">
                <img src="${i.gambar_url}" class="w-12 h-12 rounded-lg object-cover border" onerror="this.src='https://placehold.co/40'">
                <div class="flex-1">
                  <div class="font-semibold text-sm">${i.nama}</div>
                  <div class="text-xs text-gray-600">${i.jumlah} x Rp ${Number(i.harga).toLocaleString('id-ID')} = <b class="text-[#16a34a]">Rp ${subtotal.toLocaleString('id-ID')}</b></div>
                </div>
              </div>`;
          });
          detailHTML += `</div>`;
        }

        // LOGIKA TOMBOL BARU
        let pesanWA = `Halo Admin SARAHmart%0ASaya mau tanya pesanan ID: ${p.id_pesanan}%0ANama: ${p.nama_pelanggan}`;
        let bisaBatal = p.status == 'Baru'; // MUNG ISO BATAL NEK STATUS BARU
        
        let tombolBatal = bisaBatal 
          ? `<button onclick="batalPesanan('${p.id_pesanan}')" class="bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-600">❌ Batalkan</button>` 
          : `<button disabled class="bg-gray-300 text-gray-500 text-xs font-bold px-3 py-1.5 rounded-lg cursor-not-allowed">❌ Tidak bisa dibatalkan</button>`;
        
        let tombolBeliLagi = p.status == 'Selesai' ? `<button onclick="beliLagi(${p.id})" class="bg-[#16a34a] text-white text-xs font-bold px-3 py-1.5 rounded-lg">🛒 Beli Lagi</button>` : '';

        container.innerHTML += `
          <div class="bg-white rounded-2xl p-4 shadow-md border border-green-100">
            <div class="flex justify-between items-start mb-2">
              <div>
                <b class="text-sm">ID: ${p.id_pesanan}</b>
                <p class="text-xs text-gray-500">${new Date(p.created_at).toLocaleString('id-ID')}</p>
              </div>
              <span class="${statusClass} text-white text-xs font-bold px-3 py-1 rounded-full">${p.status}</span>
            </div>
            
            <p class="text-sm">Total: <b class="text-lg text-[#16a34a]">Rp ${Number(p.total_harga).toLocaleString('id-ID')}</b></p>
            
            ${detailHTML}

            <div class="mt-3 flex-wrap gap-2">
              <a href="https://wa.me/${ADMIN_WA}?text=${pesanWA}" target="_blank" class="bg-green-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">💬 Tanya Admin</a>
              ${tombolBatal}
              ${tombolBeliLagi}
            </div>
          </div>`;
      });
    }

    async function batalPesanan(id_pesanan){
      if(!confirm('Yakin mau batalkan pesanan '+id_pesanan+'?')) return;
      
      const {error} = await db.from('pesenan').update({status: 'Dibatalkan'}).eq('id_pesanan', id_pesanan);
      if(error){ alert('Gagal batal: '+error.message) } 
      else {
        alert('Pesanan dibatalkan');
        loadPesanan();
      }
    }

    function beliLagi(id){
      const pesanan = semuaPesanan.find(p => p.id == id);
      if(!pesanan) return;
      let items = typeof pesanan.data_keranjang === 'string' ? JSON.parse(pesanan.data_keranjang) : pesanan.data_keranjang;
      
      localStorage.setItem('keranjang_sarahmart', JSON.stringify(items));
      alert('Produk ditambahkan ke keranjang');
      window.location.href = 'keranjang.html';
    }
  </script>
</body>
</html>
