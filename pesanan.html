<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Pesanan Saya - SARAHmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{background:#f0fdf4;padding:20px}
    .pesanan-item{background:white;border-radius:12px;padding:12px;margin:10px 0;border:2px solid #dcfce7;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
    .status-badge{padding:4px 10px;border-radius:15px;font-size:11px;font-weight:bold;color:white}
    .status-baru{background:#ff9800}
    .status-proses{background:#2563eb}
    .status-selesai{background:#22c55e}
    .detail-produk{margin-top:8px;padding-top:8px;border-top:1px dashed #dcfce7;font-size:13px}
    .item-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
    .item-row img{width:40px;height:40px;border-radius:8px;object-fit:cover}
  </style>
</head>
<body>
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <button onclick="window.location.href='index.html'" class="bg-white px-4 py-2 rounded-xl shadow text-ijo-biru-700 font-bold">← Kembali Belanja</button>
      <h3 class="text-xl font-bold text-ijo-biru-700">📦 Riwayat Pesanan</h3>
    </div>

    <button onclick="loadPesanan()" class="w-full bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white py-3 rounded-xl font-bold shadow-lg mb-4">Muat Pesanan Saya</button>
    <div id="list-pesanan"><p class="text-center text-gray-500">Klik tombol diatas untuk memuat pesanan</p></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let dataProfil = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user }} = await db.auth.getUser();
      if(!user) return window.location.href = 'index.html';
      
      const {data, error} = await db.from('profiles').select('*').eq('id', user.id).single();
      if(error){ console.log(error); return; }
      
      dataProfil = data;
      if(!data || !data.nama_lengkap || !data.no_wa){
        alert('Lengkapi profil dulu di halaman utama');
        window.location.href = 'index.html';
      } else {
        loadPesanan();
      }
    });

    async function loadPesanan(){
      if(!dataProfil) return alert('Lengkapi profil dulu');
      const hp = dataProfil.no_wa;
      document.getElementById('list-pesanan').innerHTML = 'Loading...';
      
      const {data, error} = await db.from('pesenan').select('*').eq('no_hp', hp).order('created_at', {ascending:false});
      
      if(error){
        document.getElementById('list-pesanan').innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`; 
        return;
      }
      
      const container = document.getElementById('list-pesanan');
      if(!data || data.length == 0){
        container.innerHTML = '<p style="text-align:center">Belum ada pesanan</p>';
        return;
      }
      
      container.innerHTML = '';
      data.forEach(p => {
        let statusClass = p.status == 'Baru' ? 'status-baru' : p.status == 'Proses' ? 'status-proses' : 'status-selesai';
        let detailHTML = '';
        
        // AMBIL DARI KOLOM data_keranjang
        let items = [];
        try {
          items = typeof p.data_keranjang === 'string' ? JSON.parse(p.data_keranjang) : p.data_keranjang;
        } catch(e){ console.log("Gagal parse data_keranjang", e) }

        if(items && items.length > 0){
          detailHTML = `<div class="detail-produk"><b>Detail Pesanan:</b>`;
          items.forEach(i => {
            let subtotal = i.harga * i.jumlah;
            detailHTML += `
              <div class="item-row">
                <img src="${i.gambar_url}" alt="${i.nama}">
                <div>
                  <div class="font-semibold">${i.nama}</div>
                  <div class="text-xs text-gray-600">${i.jumlah} x Rp ${Number(i.harga).toLocaleString('id-ID')} = <b>Rp ${subtotal.toLocaleString('id-ID')}</b></div>
                </div>
              </div>`;
          });
          detailHTML += `</div>`;
        } else {
          detailHTML = `<div class="detail-produk text-gray-500">*Detail produk tidak tersimpan</div>`;
        }

        container.innerHTML += `
          <div class="pesanan-item">
            <div style="display:flex;justify-content:space-between">
              <b>ID: ${p.id_pesanan}</b>
              <span class="status-badge ${statusClass}">${p.status}</span>
            </div>
            <small>${new Date(p.created_at).toLocaleString('id-ID')}</small>
            <p style="margin:8px 0">Total: <b style="color:#22c55e">Rp ${Number(p.total_harga).toLocaleString('id-ID')}</b></p>
            ${detailHTML}
          </div>`;
      });
    }
  </script>
</body>
</html>
