<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar - Sarahmart</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#16a34a">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center min-h-screen p-4">

    <div id="loading" class="text-center">
        <div class="w-12 h-12 border-4 border-green-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="mt-3 text-slate-600">Mengecek sesi...</p>
    </div>

    <div id="auth-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md hidden">
        <div class="text-center mb-6">
            <img src="logo-sarahmart.png" alt="Logo Sarahmart" class="w-40 h-20 mx-auto mb-3 rounded-2xl shadow-md object-cover">
            <h2 class="text-2xl font-bold text-center text-green-700">Masuk ke Sarahmart</h2>
        </div>
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <input type="email" id="login-email" required placeholder="Email" class="w-full px-4 py-2.5 border rounded-xl">
            <input type="password" id="login-password" required placeholder="Password" class="w-full px-4 py-2.5 border rounded-xl">
            <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-semibold">Masuk</button>
        </form>
        <div class="flex justify-between items-center mt-6 text-sm">
            <button onclick="openModal('modal-daftar')" class="text-green-600 font-medium">Belum punya akun? Daftar</button>
            <button onclick="openModal('modal-lupa')" class="text-slate-500">Lupa Password?</button>
        </div>
    </div>

    <!-- MODAL DAFTAR -->
    <div id="modal-daftar" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h3 class="text-xl font-bold text-center mb-4 text-green-700">Daftar Akun Baru</h3>
            <form id="form-daftar" onsubmit="handleDaftar(event)" class="space-y-4">
                <input type="email" id="daftar-email" required placeholder="Email" class="w-full px-4 py-2.5 border rounded-xl">
                <input type="text" id="daftar-username" required placeholder="Username. Wajib ada angka & symbol" class="w-full px-4 py-2.5 border rounded-xl">
                <p id="username-error" class="text-xs text-red-500 hidden"></p>
                <input type="password" id="daftar-password" required placeholder="Password" class="w-full px-4 py-2.5 border rounded-xl">
                <input type="password" id="daftar-repassword" required placeholder="Ulangi Password" class="w-full px-4 py-2.5 border rounded-xl">
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal('modal-daftar')" class="w-1/2 bg-slate-200 py-2.5 rounded-xl">Batal</button>
                    <button type="submit" class="w-1/2 bg-green-600 text-white py-2.5 rounded-xl">Daftar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL OTP EMAIL BARU -->
    <div id="modal-otp" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h3 class="text-xl font-bold text-center mb-2">Verifikasi Email</h3>
            <p class="text-sm text-slate-500 text-center mb-4">Kode 6 digit sudah dikirim ke <b id="email-otp-target"></b></p>
            <form id="form-otp" onsubmit="handleVerifyOTP(event)" class="space-y-4">
                <input type="text" id="input-otp" required maxlength="6" placeholder="Masukkan 6 digit kode" class="w-full px-4 py-2.5 border rounded-xl text-center text-2xl tracking-widest">
                <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-semibold">Verifikasi</button>
            </form>
            <button onclick="kirimUlangOTP()" class="w-full text-sm text-green-600 mt-3">Kirim Ulang Kode</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const REDIRECT_URL = 'sarahmart.html';
    let emailUntukOTP = '';

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } }= await supabaseClient.auth.getSession();
        if (session) window.location.href = REDIRECT_URL;
        else {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
        }
    });

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

    function validateUsername(username) {
        const errorEl = document.getElementById('username-error');
        errorEl.classList.add('hidden');
        if (username.length < 4) { errorEl.innerText = 'Minimal 4 karakter'; errorEl.classList.remove('hidden'); return false; }
        if (!/[0-9]/.test(username)) { errorEl.innerText = 'Wajib ada angka'; errorEl.classList.remove('hidden'); return false; }
        if (!/[^a-zA-Z0-9]/.tekst(username)) { errorEl.innerText = 'Wajib ada symbol _.-'; errorEl.classList.remove('hidden'); return false; }
        return true;
    }

    async function handleLogin(e) {
        e.preventDefault();
        const { error } = await supabaseClient.auth.signInWithPassword({ 
            email: document.getElementById('login-email').value, 
            password: document.getElementById('login-password').value 
        });
        if (error) alert('Login Gagal: ' + error.message); else window.location.href = REDIRECT_URL;
    }

    // DAFTAR > KIRIM OTP EMAIL
    async function handleDaftar(e) {
        e.preventDefault();
        const email = document.getElementById('daftar-email').value;
        const username = document.getElementById('daftar-username').value;
        const password = document.getElementById('daftar-password').value;

        if (document.getElementById('daftar-password').value !== document.getElementById('daftar-repassword').value) { alert('Password tidak sama!'); return; }
        if (!validateUsername(username)) return;

        const { error } = await supabaseClient.auth.signUp({
            email, password, options: { data: { username } }
        });
        if (error) { alert('Gagal: ' + error.message); return; }

        emailUntukOTP = email;
        await supabaseClient.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
        
        document.getElementById('email-otp-target').innerText = email;
        closeModal('modal-daftar');
        openModal('modal-otp');
    }

    // VERIFIKASI KODE OTP
    async function handleVerifyOTP(e) {
        e.preventDefault();
        const token = document.getElementById('input-otp').value;
        const { error } = await supabaseClient.auth.verifyOtp({ email: emailUntukOTP, token, type: 'email' });
        if (error) alert('Kode Salah: ' + error.message); 
        else { alert('Akun berhasil diverifikasi!'); window.location.href = REDIRECT_URL; }
    }

    async function kirimUlangOTP() {
        await supabaseClient.auth.signInWithOtp({ email: emailUntukOTP });
        alert('Kode baru dikirim!');
    }
</script>
</body>
</html>
