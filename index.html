<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar - Sarahmart</title>
    <!-- Tailwind CSS untuk styling cepat dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ijo-biru': {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534'
                        },
                        'biru-ijo': {
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-ijo-biru-50 to-blue-50 flex items-center justify-center min-h-screen p-4">

    <!-- LOADING PAS CEK SESI -->
    <div id="loading" class="text-center">
        <div class="w-12 h-12 border-4 border-ijo-biru-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="mt-3 text-slate-600">Mengecek sesi...</p>
    </div>

    <!-- KONTAINER UTAMA LOGIN -->
    <div id="auth-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-ijo-biru-100 hidden">
        <div class="text-center mb-6">
            <!-- LOGO -->
            <img src="logo-sarahmart.png" alt="Logo Sarahmart" class="w-40 h-20 mx-auto mb-3 rounded-2xl shadow-md object-cover">
            <h2 class="text-2xl font-bold text-center bg-gradient-to-r from-ijo-biru-700 to-biru-ijo-700 bg-clip-text text-transparent">Masuk ke Sarahmart</h2>
        </div>

        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
            </div>

            <!-- Tombol Lihat Password - FITUR LAMA AMAN -->
            <div class="flex items-center">
                <input type="checkbox" id="show-login-password" onclick="togglePassword('login-password')" class="h-4 w-4 text-ijo-biru-600 rounded border-slate-300 focus:ring-ijo-biru-500">
                <label for="show-login-password" class="ml-2 text-sm text-slate-600">Lihat Password</label>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white py-2.5 rounded-xl font-semibold hover:from-ijo-biru-700 hover:to-biru-ijo-700 transition shadow-md">Masuk</button>
        </form>

        <div class="flex justify-between items-center mt-6 text-sm">
            <button onclick="openModal('modal-daftar')" class="text-ijo-biru-600 hover:text-ijo-biru-700 font-medium hover:underline transition">Belum punya akun? Daftar</button>
            <button onclick="openModal('modal-lupa')" class="text-slate-500 hover:text-slate-700 hover:underline transition">Lupa Password?</button>
        </div>
    </div>

    <!-- MODAL DAFTAR - NAMA & WA UDAH DIHAPUS -->
    <div id="modal-daftar" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto border-ijo-biru-100">
            <div class="text-center mb-4">
                <h3 class="text-xl font-bold bg-gradient-to-r from-ijo-biru-700 to-biru-ijo-700 bg-clip-text text-transparent">Daftar Akun Baru</h3>
            </div>

            <form id="form-daftar" onsubmit="handleDaftar(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="daftar-email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
                </div>

                <!-- USERNAME MANUAL + WAJIB ANGKA & SYMBOL - FITUR LAMA AMAN -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username <span class="text-red-500">*</span></label>
                    <p class="text-xs text-slate-500 mb-1">Wajib ada Angka & Symbol. Contoh: budi_123</p>
                    <input type="text" id="daftar-username" required placeholder="min 4 karakter" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
                    <p id="username-error" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="daftar-password" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Ulangi Password</label>
                    <input type="password" id="daftar-repassword" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
                </div>

                <!-- Lihat Password - FITUR LAMA AMAN -->
                <div class="flex items-center">
                    <input type="checkbox" id="show-daftar-password" onclick="toggleMultiplePassword(['daftar-password', 'daftar-repassword'])" class="h-4 w-4 text-ijo-biru-600 rounded border-slate-300 focus:ring-ijo-biru-500">
                    <label for="show-daftar-password" class="ml-2 text-sm text-slate-600">Lihat Password</label>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal('modal-daftar')" class="w-1/2 bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-300 transition">Batal</button>
                    <button type="submit" class="w-1/2 bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white py-2.5 rounded-xl font-semibold hover:from-ijo-biru-700 hover:to-biru-ijo-700 transition shadow-md">Daftar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL LUPA PASSWORD - FITUR LAMA AMAN -->
    <div id="modal-lupa" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-ijo-biru-100">
            <div class="text-center mb-4">
                <h3 class="text-xl font-bold bg-gradient-to-r from-ijo-biru-700 to-biru-ijo-700 bg-clip-text text-transparent">Reset Password</h3>
            </div>

            <form onsubmit="handleLupaPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Masukkan Email Anda</label>
                    <input type="email" id="lupa-email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500 focus:border-ijo-biru-500 transition">
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal('modal-lupa')" class="w-1/2 bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-300 transition">Batal</button>
                    <button type="submit" class="w-1/2 bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white py-2.5 rounded-xl font-semibold hover:from-ijo-biru-700 hover:to-biru-ijo-700 transition shadow-md">Kirim Link</button>
                </div>
            </form>
        </div>
    </div>
<!-- NOTIFIKASI UPDATE PWA -->
<div id="update-notif" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-ijo-biru-700 text-white px-5 py-3 rounded-xl shadow-2xl z-[9999] flex items-center gap-3">
  <span>Ada versi baru tersedia!</span>
  <button id="btn-reload" class="bg-white text-ijo-biru-700 font-bold px-3 py-1 rounded-lg">Update</button>
</div>

<script>
let newWorker;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              document.getElementById('update-notif').classList.remove('hidden');
            }
          });
        });
    });

    document.getElementById('btn-reload').addEventListener('click', () => {
        if (newWorker) newWorker.postMessage({ type: 'SKIP_WAITING' });
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
    });
  });
}
</script>
    <!-- SKRIP INTEGRASI SUPABASE & LOGIKA APLIKASI -->
    <script>
        const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const REDIRECT_URL = 'sarahmart.html';

        // CEK SESI PAS BUKA HALAMAN - FITUR LAMA AMAN
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // NEK WES LOGIN/VERIFIKASI LANGSUNG ARAHNO NANG SARAHMART
                window.location.href = REDIRECT_URL;
            } else {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('auth-container').classList.remove('hidden');
            }
        });

        // Fungsi Modal - FITUR LAMA AMAN
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Toggle Lihat Password - FITUR LAMA AMAN
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password'? 'text' : 'password';
        }

        function toggleMultiplePassword(ids) {
            ids.forEach(id => togglePassword(id));
        }

        // VALIDASI USERNAME BARU: WAJIB ADA ANGKA + SYMBOL - FITUR LAMA AMAN
        function validateUsername(username) {
            const errorEl = document.getElementById('username-error');
            errorEl.classList.add('hidden');

            if (username.length < 4) {
                errorEl.innerText = 'Username minimal 4 karakter';
                errorEl.classList.remove('hidden');
                return false;
            }
            if (!/[0-9]/.test(username)) { // WAJIB ADA ANGKA
                errorEl.innerText = 'Username wajib ada angka 0-9';
                errorEl.classList.remove('hidden');
                return false;
            }
            if (!/[^a-zA-Z0-9]/.test(username)) { // WAJIB ADA SYMBOL
                errorEl.innerText = 'Username wajib ada symbol. Contoh: _. -';
                errorEl.classList.remove('hidden');
                return false;
            }
            return true;
        }

        // Handle Login - FITUR LAMA AMAN
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Login Gagal: ' + error.message);
            } else {
                // Langsung masuk ke aplikasi tanpa PIN
                window.location.href = REDIRECT_URL;
            }
        }

        // Handle Daftar - UDAH DIHAPUS NAMA & WA
        async function handleDaftar(e) {
            e.preventDefault();
            const email = document.getElementById('daftar-email').value;
            const username = document.getElementById('daftar-username').value;
            const password = document.getElementById('daftar-password').value;
            const repassword = document.getElementById('daftar-repassword').value;

            if (password!== repassword) {
                alert('Password dan Ulangi Password tidak sama!');
                return;
            }

            if (!validateUsername(username)) return; // CEK VALIDASI DULU

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + '/' + REDIRECT_URL, // LANGSUNG NANG SARAHMART PAS VERIF
                    data: { username: username } // CUKUP USERNAME TOK
                }
            });

            if (error) {
                alert('Pendaftaran Gagal: ' + error.message);
            } else {
                alert('Pendaftaran berhasil! Silakan cek email Anda untuk verifikasi. Setelah klik link, kamu langsung masuk ke Sarahmart.');
                closeModal('modal-daftar');
            }
        }

        // Handle Lupa Password - FITUR LAMA AMAN
        async function handleLupaPassword(e) {
            e.preventDefault();
            const email = document.getElementById('lupa-email').value;

            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/' + REDIRECT_URL,
            });

            if (error) {
                alert('Gagal mengirim link reset: ' + error.message);
            } else {
                alert('Link reset password telah dikirim ke email Anda.');
                closeModal('modal-lupa');
            }
        }
    </script>
</body>
</html>
