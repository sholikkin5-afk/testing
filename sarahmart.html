<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="manifest.json">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ijo-biru': { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 800:'#166534' },
            'biru-ijo': { 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
          },
          animation: { 'fade-in': 'fadeIn 0.3s ease-out', 'goyang': 'goyang 0.5s' },
          keyframes: {
            fadeIn: { '0%': { opacity: '0', transform: 'scale(0.95)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
            goyang: { '0%,100%': {transform:'scale(1)'}, '50%': {transform:'scale(1.15)'} }
          }
        }
      }
    }
  </script>

  <style>
    /* SISA CSS LAWAS SING GK ISO DIGANTI TAILWIND TAK PERTAHANKE */
    body{background:#f0fdf4;padding-bottom:20px;padding-top:210px}
    header{background:linear-gradient(135deg, #16a34a 0%, #2563eb 100%);color:white;padding:12px 10px 25px 10px;position:fixed;top:0;left:0;right:0;z-index:10;box-shadow:0 4px 12px rgba(22,163,74,0.3)}
 .header-atas{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;position:relative;height:40px}
 .logo-wrap{position:absolute;left:50%;transform:translateX(-50%)}
    header img{width:150px;height:75px;margin-top:25px;border-radius:10px;background:white;object-fit:contain;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
 .icon-keranjang-atas{position:relative;background:white;color:#16a34a;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,0.3);cursor:pointer;font-size:20px;margin-top:-10px}
 .lencana{position:absolute;top:-3px;right:-3px;background:#ff1744;color:white;font-size:10px;font-weight:bold;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:2px solid white}
 .lencana.goyang{animation:goyang 0.5s}
 .header-bawah{display:flex;gap:8px;max-width:1200px;margin-top:33px}
 .search{flex:2}
 .search input{width:100%;padding:10px;border:2px solid rgba(255,255,255,0.3);border-radius:12px;color:#000;background:rgba(255,255,255,0.95);font-size:14px}
 .search input:focus{outline:none;border-color:#22c55e}
 .kategori-wrap{flex:2}
    #btn-kategori{width:100%;padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.95);color:#16a34a;font-weight:bold;font-size:14px;cursor:pointer;text-align:left}
    #btn-kategori:focus{outline:none;border-color:#22c55e}
    #popupKategori {
      align-items: center !important;
      justify-content: center !important;
    }
    #popupKategori .popup-content {
      position: relative !important;
      border-radius: 20px !important; 
      margin: 20px !important;
      width: calc(100% - 40px) !important;
      max-width: 450px !important;
      overflow: hidden !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2) !important;
      animation: slideUpKategori 0.3s !important;
      background: #ffffff !important;
    }
    @keyframes slideUpKategori {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #popupKategori .popup-header {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      padding: 16px 20px !important;
      border-bottom: 1px solid #e2e8f0 !important;
      background: #ffffff !important;
      border-radius: 20px 20px 0 0 !important;
    }
    #popupKategori #list-kategori {
      padding-bottom: 10px !important;
      max-height: 60vh !important;
      overflow-y: auto !important;
      background: white;
      border-radius: 0 0 20px 20px;
    }
    #popupKategori .close-btn {
      width:32px;
      height:32px;
      border-radius:50%;
      background:#f1f5f9;
      color:#64748b;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      border:none;

 .menu-atas{display:flex;justify-content:center;gap:10px;padding:10px 0 0 0;max-width:1200px;margin-top:-5px;margin-bottom:-18px}
 .btn-menu{padding:8px 15px;border:none;border-radius:20px;background:rgba(255,255,255,0.2);color:white;font-weight:bold;cursor:pointer;font-size:13px;transition:0.2s;flex-shrink:0}
 .btn-menu.aktif{background:white;color:#16a34a;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
 .btn-reset-filter{display:none;margin:10px auto;padding:8px 15px;border:none;border-radius:20px;background:#757575;color:white;font-weight:bold;cursor:pointer}
 .banner-slider{position:relative;overflow:hidden;margin-top:-30px;border-radius:15px;height:160px;touch-action:pan-y}
 .banner-track{display:flex;transition:transform 0.5s ease-out;height:100%;cursor:grab}
 .banner-track.dragging{cursor:grabbing;transition:none}
 .banner-item{min-width:100%;height:100%;position:relative;cursor:pointer}
 .banner-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
 .banner-text{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.7));color:white;padding:12px;font-weight:bold;font-size:14px}
 .banner-dots{display:flex;justify-content:center;gap:6px;position:absolute;bottom:10px;left:0;right:0}
 .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.5)}
 .dot.aktif{background:white}

   .card:hover{transform:translateY(-3px);box-shadow:0 5px 15px rgba(25,118,210,0.2)}
   .card:active{transform:translateY(-3px)}

   .card:active img{transform:scale(1.08)}
   .badge-diskon{position:absolute;top:10px;left:10px;background:#ff1744;color:white;font-size:10px;font-weight:bold;padding:3px 7px;border-radius:6px;z-index:2;pointer-events:none;animation:kedip 1s infinite}
    @keyframes kedip{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
   .badge-baru{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#00c853 0%,#1976d2 100%);color:white;font-size:10px;font-weight:bold;padding:3px 7px;border-radius:6px;z-index:2;animation:kedipBaru 1.5s infinite}
   .badge-terlaris{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#ff9800 0%,#ff1744 100%);color:white;font-size:10px;font-weight:bold;padding:3px 7px;border-radius:6px;z-index:2}

   .stok-habis{color:#d32f2f;font-weight:bold}
   .btn-tambah{background:linear-gradient(135deg, #1976d2 0%, #00c853 100%);color:white;border:none;width:100%;padding:10px;border-radius:10px;margin-top:6px;font-weight:bold;cursor:pointer;transition:0.2s}
   .btn-tambah:active{transform:scale(0.95)}
   .btn-tambah:disabled{background:#ccc;cursor:not-allowed}
 .fly-img{position:fixed;width:50px;height:50px;border-radius:10px;z-index:9999;pointer-events:none;transition:all 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55)}
 .pagination{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);display:flex;justify-content:space-between;padding:0 10px;z-index:9;pointer-events:none}
 .pagination button{pointer-events:auto;width:45px;height:45px;border:none;background:rgba(22,163,74,0.25);backdrop-filter:blur(15px);color:white;border-radius:50%;font-weight:bold;cursor:pointer;font-size:22px;box-shadow:0 0 20px rgba(22,163,74,0.2);border:1px solid rgba(255,255,255,0.25);transition:0.3s}
 .pagination button:active{transform:scale(0.9);background:rgba(22,163,74,0.45)}
 .pagination button:disabled{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.25);box-shadow:none;cursor:not-allowed}
 .popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:20;align-items:flex-end;animation:fadeIn 0.3s}
 .popup-content{background:white;width:100%;max-width:600px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:85vh;overflow-y:auto;animation:slideUp 0.3s}
 .pesanan-item{background:white;border-radius:12px;padding:12px;margin:10px;border:2px solid #dcfce7}
 .status-badge{padding:4px 10px;border-radius:15px;font-size:11px;font-weight:bold;color:white}
 .status-baru{background:#ff9800}
 .status-proses{background:#2563eb}
 .status-selesai{background:#22c55e}
 .item-kategori{padding:15px;border-bottom:1px solid #dcfce7;cursor:pointer;font-weight:bold;color:#15803d;display:flex;align-items:center;gap:10px}
 .item-kategori.aktif{color:#22c55e;background:#f0fdf4}
    #popupKategori.popup-header {display: flex!important; justify-content: space-between!important; align-items: center!important; padding: 16px 20px!important; border-bottom: 1px solid #e2e8f0!important; background: #ffffff!important; border-radius: 20px 20px 0 0!important;}
    #popupKategori.close-btn {width:32px; height:32px; border-radius:50%; background:#f1f5f9; color:#64748b; display:flex; align-items:center; justify-content:center; font-size:16px; border:none; cursor:pointer; transition:0.2s;}
    #popupKategori.close-btn:hover {background:#e2e8f0; color:#0f172a;}
    @media(min-width: 768px){
      body{padding-top:220px}
   .header-atas,.header-bawah,.produk,.banner-slider,.pagination,.menu-atas{max-width:1200px;margin:0 auto}
   .produk{grid-template-columns:repeat(4, 1fr);gap:18px;padding:20px}

   .card h3{height:40px;font-size:15px}

   .popup{align-items:stretch}
    }
  </style>
</head>
<body>
  <header id="main-header">
    <div class="header-atas">
      <div></div>
      <div class="logo-wrap"><img src="logo-sarahmart.png" alt="Logo SARAHmart"></div>
      <div class="icon-keranjang-atas" onclick="window.location.href='keranjang.html'">🛒<div class="lencana" id="jumlah-lencana">0</div></div>
    </div>
    <div class="header-bawah">
      <div class="search"><input type="text" id="cari" placeholder="🔍 Cari produk di SARAHmart..." onkeyup="cariProduk()"></div>
      <div class="kategori-wrap"><button id="btn-kategori" onclick="bukaPopupKategori()">📦 Semua Kategori <span style="float:right">▼</span></button></div>
    </div>
    <div class="menu-atas">
      <button class="btn-menu aktif" onclick="gantiMenu('produk', this)">🛍️ Produk</button>
      <button class="btn-menu" onclick="gantiMenu('pesanan', this)">📦 Pesanan Saya</button>
    </div>
  </header>

  <div id="halaman-produk">
    <div class="banner-slider"><div class="banner-track" id="banner-track"></div><div class="banner-dots" id="banner-dots"></div></div>
    <div style="text-align:center"><button class="btn-reset-filter" id="btn-reset-filter" onclick="resetFilter()">❌ Hapus Filter</button></div>
    <div class="produk" id="daftar-produk">Loading produk...</div>
    <div class="pagination" id="pagination"><button id="btn-prev" onclick="gantiHalaman(-1)"><</button><button id="btn-next" onclick="gantiHalaman(1)">></button></div>
  </div>

  <div id="halaman-pesanan" style="display:none;max-width:800px;margin:auto;padding:10px">
    <h3 style="text-align:center;color:#16a34a;margin:15px 0">📦 Riwayat Pesanan</h3>
    <button onclick="loadPesanan()" class="w-full bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white py-3 rounded-xl font-bold">Muat Pesanan Saya</button>
    <div id="list-pesanan" style="margin-top:15px"></div>
  </div>

  <!-- POPUP PROFIL VERSI BARU - DROPDOWN DESA DARI SETTING -->
  <div class="popup" id="popupProfil" style="z-index:999;align-items:center">
    <div class="popup-content bg-white rounded-2xl shadow-2xl border-ijo-biru-100 animate-fade-in">
      <div class="text-center p-6 border-b border-slate-100">
        <div class="text-4xl mb-2">👋</div>
        <h3 class="text-xl font-bold bg-gradient-to-r from-ijo-biru-700 to-biru-ijo-700 bg-clip-text text-transparent">Lengkapi Data Anda</h3>
        <p class="text-sm text-slate-500 mt-1">Isi sekali saja untuk mempermudah pengiriman pesanan</p>
      </div>
      <form id="form-profil" onsubmit="simpanProfil(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">1. Nama Lengkap <span class="text-red-500">*</span></label>
          <input type="text" id="profil-nama" required placeholder="Mohon di isi nama asli" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">2. No WA Aktif <span class="text-red-500">*</span></label>
          <input type="tel" id="profil-wa" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-ijo-biru-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">3. Alamat Lengkap <span class="text-red-500">*</span></label>
          <label class="text-xs text-slate-600">Desa Wilayah Terlayani <span class="text-red-500">*</span></label>
          <select id="profil-desa" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl mb-2 focus:ring-ijo-biru-500">
            <option value="">-- Pilih Desa --</option>
          </select>
          <label class="text-xs text-slate-600">Jalan / Gang / RT RW</label>
          <input type="text" id="profil-jalan" required placeholder="Jl. Mawar No.10 RT 01 RW 02" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl mb-2 focus:ring-ijo-biru-500">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-slate-600">Kecamatan</label>
              <input type="text" id="profil-kecamatan" required placeholder="Contoh: Gresik" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-ijo-biru-500">
            </div>
            <div>
              <label class="text-xs text-slate-600">Kabupaten</label>
              <input type="text" id="profil-kabupaten" required placeholder="Contoh: Gresik" class="w-full px-4 py-2.5 border border border-slate-300 rounded-xl focus:ring-ijo-biru-500">
            </div>
          </div>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white py-3 rounded-xl font-bold shadow-lg">Simpan & Mulai Belanja</button>
      </form>
    </div>
  </div>

  <div class="popup" id="popupNotif" style="z-index:999;align-items:center">
    <div class="popup-content" style="max-width:400px;text-align:center;padding:25px;border-radius:20px">
      <div id="icon-notif" style="font-size:50px;margin-bottom:10px">✅</div>
      <h3 id="judul-notif" style="color:#16a34a;margin-bottom:8px">Sukses</h3>
      <p id="pesan-notif" style="color:#666;margin-bottom:20px">Isi data pengiriman dulu!</p>
      <button onclick="tutupNotif()" class="bg-gradient-to-r from-ijo-biru-600 to-biru-ijo-600 text-white px-8 py-3 rounded-xl font-bold">Oke</button>
    </div>
  </div>

  <div class="popup" id="popupKategori" style="z-index:998">
    <div class="popup-content" style="max-width:500px;border-radius:20px 20px 0 0">
      <div class="popup-header"><h3>🏷️ Pilih Kategori</h3><button class="close-btn" onclick="tutupPopupKategori()">x</button></div>
      <div id="list-kategori"></div>
    </div>
  </div>

  <!-- NOTIFIKASI UPDATE PWA -->
  <div id="update-notif" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-ijo-biru-700 text-white px-5 py-3 rounded-xl shadow-2xl z-[9999] flex items-center gap-3">
    <span>Ada versi baru tersedia!</span>
    <button id="btn-reload" class="bg-white text-ijo-biru-700 font-bold px-3 py-1 rounded-lg">Update</button>
  </div>

  <script src="/pwa.js"></script>
  <script>
    const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let produk = []; let allProduk = []; let keranjang = []; let kategoriAktif = 'Semua';
    let halamanAktif = 1; const perHalaman = 10; let produkFilter = [];
    let bannerIndex = 0; let bannerInterval; let startX = 0; let isDragging = false; let dragThreshold = false;
    let settingPromo = {aktif: false, minimal: 100000, tgl_akhir: null, biaya_layanan: 2000, ongkir_default: 2000, gambar_urls: []};
    let dataProfil = null;
    let daftarDesa = []; // UNTUK DROPDOWN DESA DARI ADMIN

    document.addEventListener('DOMContentLoaded', async () => {
      keranjang = JSON.parse(localStorage.getItem('keranjang_sarahmart')) || [];
      await loadSettingPromo();
      await loadDesaTerlayani(); // LOAD DESA DARI SETTING - IKI PENTING
      await cekProfilUser();
      loadProduk();
      updateKeranjangBar();
    });

    async function loadDesaTerlayani(){
      try{
        const {data} = await db.from('setting').select('value').eq('key','desa_terlayani').single();
        if(data && data.value){
          daftarDesa = typeof data.value === 'string'? JSON.parse(data.value) : data.value;
        } else {
          daftarDesa = ["Gresik","Kebomas","Sidomoro","Dukun","Tandes"]; // default 0-5km
        }
      }catch(e){
        console.log("Gagal load desa", e);
        daftarDesa = ["Gresik","Kebomas","Sidomoro","Dukun","Tandes"];
      }
      isiDropdownDesa(); // LANGSUNG ISI DROPDOWN
    }

    function isiDropdownDesa(){
      const select = document.getElementById('profil-desa');
      if(!select) return;
      select.innerHTML = `<option value="">-- Pilih Desa --</option>`;
      daftarDesa.forEach(desa => {
        select.innerHTML += `<option value="${desa}">${desa}</option>`;
      });
    }

    async function cekProfilUser(){
      const { data: { user } } = await db.auth.getUser();
      if(!user) return window.location.href = 'index.html';
      const {data} = await db.from('profiles').select('*').eq('id', user.id).single();
      dataProfil = data;
      if(!data ||!data.nama_lengkap ||!data.no_wa){
        document.getElementById('popupProfil').style.display = 'flex';
      }
    }

    async function simpanProfil(e){
      e.preventDefault();
      const { data: { user } } = await db.auth.getUser();
      const profilData = {
        id: user.id,
        nama_lengkap: document.getElementById('profil-nama').value,
        no_wa: document.getElementById('profil-wa').value,
        desa: document.getElementById('profil-desa').value,
        jalan: document.getElementById('profil-jalan').value,
        kecamatan: document.getElementById('profil-kecamatan').value,
        kabupaten: document.getElementById('profil-kabupaten').value,
      };
      const {error} = await db.from('profiles').upsert(profilData);
      if(error){ alert('Gagal simpan: '+error.message); }
      else {
        dataProfil = profilData;
        document.getElementById('popupProfil').style.display = 'none';
        showNotifAyu('Data berhasil disimpan!', 'sukses');
      }
    }

    async function loadSettingPromo(){
      const {data} = await db.from('setting').select('*').eq('key','promo_undian').single();
      if(data && data.value){
        settingPromo = typeof data.value === 'string'? JSON.parse(data.value) : data.value;
      }
    }

    async function loadBanner(){
      const track = document.getElementById('banner-track');
      const dots = document.getElementById('banner-dots');
      track.innerHTML = ''; dots.innerHTML = '';
      const today = new Date().toISOString().split('T')[0];
      let bannerOtomatis = [];
      if(settingPromo.aktif && (!settingPromo.tgl_akhir || today <= settingPromo.tgl_akhir)){
        let tglText = settingPromo.tgl_akhir? `Berlaku s/d ${new Date(settingPromo.tgl_akhir).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}` : `Berlaku kelipatan!`;
        let gambarKolase = '';
        const imgs = settingPromo.gambar_urls || [];
        if(imgs.length === 0){
          gambarKolase = `<div style="background:linear-gradient(135deg, #ff9800 0%, #ff1744 100%);display:flex;align-items:center;justify-content:center;height:100%;color:white;text-align:center"><div><div style="font-size:24px">🎟️🎁🎟️</div><div>Hadiah Menarik Menanti!</div></div></div>`;
        } else if(imgs.length === 1){
          gambarKolase = `<img src="${imgs[0]}" style="width:100%;height:100%;object-fit:cover;">`;
        } else if(imgs.length === 2){
          gambarKolase = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;height:100%"><img src="${imgs[0]}" style="width:100%;height:100%;object-fit:cover;"><img src="${imgs[1]}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        } else if(imgs.length === 3){
          gambarKolase = `<div style="display:grid;grid-template-columns:2fr 1fr;gap:3px;height:100%"><img src="${imgs[0]}" style="width:100%;height:100%;object-fit:cover;"><div style="display:grid;grid-template-rows:1fr 1fr;gap:3px"><img src="${imgs[1]}" style="width:100%;height:100%;object-fit:cover;"><img src="${imgs[2]}" style="width:100%;height:100%;object-fit:cover;"></div></div>`;
        } else {
          gambarKolase = `<div style="display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:100%">`;
          gambarKolase += `<img src="${imgs[0]}" style="grid-row:1/3;width:100%;height:100%;object-fit:cover;">`;
          for(let i=1; i<5 && i<imgs.length; i++){
            gambarKolase += `<img src="${imgs[i]}" style="width:100%;height:100%;object-fit:cover;">`;
          }
          if(imgs.length > 5){
            gambarKolase += `<div style="background:rgba(0,0,0,0.6);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;">+${imgs.length-5}</div>`;
          }
          gambarKolase += `</div>`;
        }
        bannerOtomatis.push({judul: `🎁 BELANJA Rp ${settingPromo.minimal.toLocaleString('id-ID')} DAPAT KUPON UNDIAN 🎁`, subjudul: `${tglText} Kupon diundi tiap akhir bulan`, gambar_html: gambarKolase, link: `#produk`});
      }

      const produkDiskon = produk.filter(p=>p.diskon>0 && p.stok>0 && (!p.tgl_kadaluarsa || p.tgl_kadaluarsa >= today));
      const grupDiskon = {};
      produkDiskon.forEach(p=>{
        if(!grupDiskon[p.diskon]) grupDiskon[p.diskon] = [];
        grupDiskon[p.diskon].push(p);
      });
      for(const persen in grupDiskon){
        const daftarProduk = grupDiskon[persen];
        daftarProduk.sort((a,b) => new Date(a.tgl_kadaluarsa || '9999-12-31') - new Date(b.tgl_kadaluarsa || '9999-12-31'));
        const produkUtama = daftarProduk[0];
        const produkLain = daftarProduk.slice(1);
        const tglAkhir = daftarProduk.map(p => p.tgl_kadaluarsa).filter(t => t).sort().pop();
        let teksTgl = '';
        if(tglAkhir){
          const tglExp = new Date(tglAkhir);
          const tglSekarang = new Date();
          const selisihWaktu = tglExp - tglSekarang;
          const selisihHari = Math.ceil(selisihWaktu / (1000 * 60 * 60 * 24));
          if(selisihHari <= 3 && selisihHari >= 0){
            teksTgl = `🔥 TINGGAL ${selisihHari} HARI LAGI!! BERLAKU S/D ${tglExp.toLocaleDateString('id-ID', {day: 'numeric', month: 'long'})}`;
          } else {
            teksTgl = `Berlaku s/d ${tglExp.toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}`;
          }
        } else {
          teksTgl = `📦 SELAMA PERSEDIAAN MASIH ADA`;
        }
        const jmlProduk = daftarProduk.length;
        let gambarKolase = `<div style="display:grid;height:100%;background:#ff1744;padding:3px;gap:3px;">`;
        if(jmlProduk == 1){
          gambarKolase += `<div style="grid-column:1/3;grid-row:1/3;overflow:hidden;border-radius:5px;"><img src="${produkUtama.gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        } else if(jmlProduk == 2){
          gambarKolase += `<div style="grid-column:1/2;grid-row:1/3;overflow:hidden;border-radius:5px;"><img src="${produkUtama.gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
          gambarKolase += `<div style="grid-column:2/3;grid-row:1/3;overflow:hidden;border-radius:5px;"><img src="${produkLain[0].gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        } else if(jmlProduk == 3){
          gambarKolase += `<div style="grid-column:1/3;grid-row:1/2;overflow:hidden;border-radius:5px;"><img src="${produkUtama.gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
          gambarKolase += `<div style="grid-column:1/2;grid-row:2/3;overflow:hidden;border-radius:5px;"><img src="${produkLain[0].gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
          gambarKolase += `<div style="grid-column:2/3;grid-row:2/3;overflow:hidden;border-radius:5px;"><img src="${produkLain[1].gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        } else {
          gambarKolase += `<div style="grid-column:1/3;grid-row:1/3;overflow:hidden;border-radius:5px;"><img src="${produkUtama.gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
                 let idx = 0;
          for(let r=1; r<3; r++){
            for(let c=3; c<5; c++){
              if(idx < produkLain.length){
                gambarKolase += `<div style="grid-column:${c}/${c+1};grid-row:${r}/${r+1};overflow:hidden;border-radius:5px;"><img src="${produkLain[idx].gambar_url}" style="width:100%;height:100%;object-fit:cover;"></div>`;
                idx++;
              }
            }
          }
          if(jmlProduk > 5){
            gambarKolase += `<div style="grid-column:4/5;grid-row:3/4;background:rgba(0,0,0,0.6);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;border-radius:5px;">+${jmlProduk-5}</div>`;
          }
        }
        gambarKolase += `</div>`;
        bannerOtomatis.push({judul: `🔥 DISKON MAWOR ${persen}% - ${jmlProduk} PRODUK 🔥`, subjudul: teksTgl, gambar_html: gambarKolase, link: `diskon${persen}`});
      }

      if(bannerOtomatis.length == 1){
        bannerOtomatis.push({judul: `SELAMAT DATANG DI SARAHMART`, subjudul: ``, gambar_html: `<img src="logo.jpg" style="width:100%;height:100%;object-fit:contain;background:white">`, link: `#produk`});
      }

      bannerOtomatis.forEach((b,i)=>{
        track.innerHTML += `<div class="banner-item" onclick="filterBanner('${b.link}')">${b.gambar_html}<div class="banner-text" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">${b.judul}${b.subjudul? `<div style="font-size:11px;font-weight:bold;margin-top:3px;color:#ffeb3b;text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">${b.subjudul}</div>` : ''}</div></div>`;
        dots.innerHTML += `<div class="dot ${i==0?'aktif':''}"></div>`;
      });
      clearInterval(bannerInterval);
      bannerIndex = 0;
      updateBannerPosition();
      if(bannerOtomatis.length > 1){
        bannerInterval = setInterval(()=>{nextBanner();}, 4000);
      }
      initBannerSwipe();
    }

    function updateBannerPosition(){ const track = document.getElementById('banner-track'); track.style.transform = `translateX(-${bannerIndex*100}%)`; document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('aktif', i==bannerIndex)); }
    function nextBanner(){ const total = document.querySelectorAll('.banner-item').length; bannerIndex = (bannerIndex+1)%total; updateBannerPosition(); }
    function prevBanner(){ const total = document.querySelectorAll('.banner-item').length; bannerIndex = (bannerIndex-1+total)%total; updateBannerPosition(); }
    function initBannerSwipe(){ const track = document.getElementById('banner-track'); const slider = document.querySelector('.banner-slider'); slider.addEventListener('touchstart', e => {startX = e.touches[0].clientX; isDragging = true; track.classList.add('dragging'); clearInterval(bannerInterval);}); slider.addEventListener('touchend', e => { if(!isDragging) return; isDragging = false; track.classList.remove('dragging'); const diff = e.changedTouches[0].clientX - startX; if(diff > 50) prevBanner(); else if(diff < -50) nextBanner(); updateBannerPosition(); bannerInterval = setInterval(nextBanner, 4000); }); }

    function filterBanner(link){ if(dragThreshold) return; if(link.startsWith('diskon')){ const persen = link.replace('diskon',''); filterProdukByDiskon(persen); document.getElementById('daftar-produk').scrollIntoView({behavior: 'smooth'}); } }
    function filterProdukByDiskon(persen){ produkFilter = produk.filter(p => p.diskon == persen); kategoriAktif = 'Semua'; document.getElementById('btn-kategori').innerHTML = `📦 Semua Kategori <span style="float:right">▼</span>`; halamanAktif = 1; tampilProduk(); document.getElementById('btn-reset-filter').style.display = 'block'; }
    function resetFilter(){ produkFilter = allProduk; kategoriAktif = 'Semua'; document.getElementById('btn-kategori').innerHTML = `📦 Semua Kategori <span style="float:right">▼</span>`; halamanAktif = 1; tampilProduk(); document.getElementById('btn-reset-filter').style.display = 'none'; }
    function gantiMenu(menu, el){ document.querySelectorAll('.btn-menu').forEach(b=>b.classList.remove('aktif')); el.classList.add('aktif'); document.getElementById('halaman-produk').style.display = menu=='produk'?'block':'none'; document.getElementById('halaman-pesanan').style.display = menu=='pesanan'?'block':'none'; }

    async function loadPesanan(){
      if(!dataProfil) return showNotifAyu('Lengkapi profil dulu','gagal');
      const hp = dataProfil.no_wa;
      const {data} = await db.from('pesenan').select('*').eq('no_hp', hp).order('created_at', {ascending:false});
      const container = document.getElementById('list-pesanan');
      if(!data || data.length==0){container.innerHTML='<p style="text-align:center">Belum ada pesanan</p>';return;}
      container.innerHTML='';
      data.forEach(p=>{
        let statusClass = p.status=='Baru'?'status-baru':p.status=='Proses'?'status-proses':'status-selesai';
        container.innerHTML += `<div class="pesanan-item"><div style="display:flex;justify-content:space-between"><b>ID: ${p.id_pesanan}</b><span class="status-badge ${statusClass}">${p.status}</span></div><small>${new Date(p.created_at).toLocaleString('id-ID')}</small><p style="margin:8px 0">Total: <b style="color:#22c55e">Rp ${Number(p.total_harga).toLocaleString('id-ID')}</b></p></div>`;
      });
    }

    async function loadProduk(){
      const container = document.getElementById('daftar-produk');
      const { data, error } = await db.from('prodak').select('*').order('deskripsi', {ascending: true}).order('nama', {ascending: true});
      if(error){container.innerHTML = `<p style='text-align:center;padding:20px;color:red'>Error: ${error.message}</p>`; return;}
      if(!data || data.length === 0){container.innerHTML = "<p style='text-align:center;padding:20px'>Belum ada produk</p>"; return;}
      data.sort(() => Math.random() - 0.5);
      produk = data; allProduk = data; produkFilter = data;
      buatListKategori(); tampilProduk(); loadBanner();
    }

    function buatListKategori(){
      const container = document.getElementById('list-kategori');
      const kategoriUnik = [...new Set(allProduk.map(p => p.deskripsi).filter(k => k))];
      let html = `<div class="item-kategori ${kategoriAktif==='Semua'?'aktif':''}" onclick="pilihKategori('Semua')">📦 Semua Kategori</div>`;
      kategoriUnik.forEach(kat => { html += `<div class="item-kategori ${kategoriAktif===kat?'aktif':''}" onclick="pilihKategori('${kat}')">🏷️ ${kat}</div>`; });
      container.innerHTML = html;
    }

    function bukaPopupKategori(){document.getElementById('popupKategori').style.display = 'flex';buatListKategori();}
    function tutupPopupKategori(){document.getElementById('popupKategori').style.display = 'none';}
    function pilihKategori(kat){ kategoriAktif = kat; document.getElementById('btn-kategori').innerHTML = `🏷️ ${kat} <span style="float:right">▼</span>`; halamanAktif = 1; cariProduk(); document.getElementById('btn-reset-filter').style.display = kat === 'Semua'? 'none' : 'block'; tutupPopupKategori(); }

    function tampilProduk(){
      const container = document.getElementById('daftar-produk');
      container.innerHTML = "";
      let start = (halamanAktif - 1) * perHalaman;
      let end = start + perHalaman;
      let dataTampil = produkFilter.slice(start, end);
      if(dataTampil.length == 0){container.innerHTML = "<p style='text-align:center;padding:20px'>Produk tidak ditemukan</p>"; return;}
      const today = new Date().toISOString().split('T')[0];
      const tgl3HariLalu = new Date(); tgl3HariLalu.setDate(tgl3HariLalu.getDate() - 3);
      const tglBaru = tgl3HariLalu.toISOString().split('T')[0];
      dataTampil.forEach((p)=>{
        let diskonAktif = p.diskon && p.diskon > 0;
        if(p.tgl_kadaluarsa && p.tgl_kadaluarsa < today) diskonAktif = false;
        const btnDisabled = p.stok <= 0? 'disabled' : '';
        const stokText = p.stok <= 0? '<span class="stok-habis">STOK HABIS</span>' : `Stok: ${p.stok}`;
        let hargaTampil = `Rp ${p.harga.toLocaleString('id-ID')}`;
        let hargaFinal = p.harga;
        let badgeDiskon = '';
        let badgeTambahan = '';
        if(diskonAktif){
          hargaFinal = Math.round(p.harga - (p.harga * p.diskon / 100));
          hargaTampil = `<div class="harga-coret">Rp ${p.harga.toLocaleString('id-ID')}</div> <span class="harga-diskon">Rp ${hargaFinal.toLocaleString('id-ID')}</span>`;
          badgeDiskon = `<div class="badge-diskon">-${p.diskon}%</div>`;
        }
        if(p.created_at && p.created_at >= tglBaru){ badgeTambahan += `<div class="badge-baru">BARU</div>`; }
        else if(p.terjual && p.terjual >= 20){ badgeTambahan += `<div class="badge-terlaris">🔥 TERLARIS</div>`; }
        if(diskonAktif && badgeTambahan.includes('badge-baru')){ badgeTambahan = badgeTambahan.replace('right:10px','right:55px'); }
        container.innerHTML += `<div class="card">${badgeDiskon}${badgeTambahan}<img src="${p.gambar_url}"><h3>${p.nama}</h3><div class="harga-wrap"><p>${hargaTampil}</p><div class="stok-info">${stokText}</div><button class="btn-tambah" ${btnDisabled} onclick="tambahKeranjang(${p.id}, ${hargaFinal}, this)">+ Tambah</button></div></div>`;
      });
      updatePagination();
    }

    function cariProduk(){
      const keyword = document.getElementById('cari').value.toLowerCase();
      produkFilter = allProduk;
      if(kategoriAktif!== 'Semua'){produkFilter = produkFilter.filter(p => p.deskripsi.includes(kategoriAktif));}
      if(keyword){produkFilter = produkFilter.filter(p => p.nama.toLowerCase().includes(keyword));}
      halamanAktif = 1;
      tampilProduk();
    }

    function gantiHalaman(arah){
      const posisiScroll = window.scrollY;
      halamanAktif += arah;
      tampilProduk();
      setTimeout(() => {window.scrollTo(0, posisiScroll);}, 50);
    }

    function updatePagination(){
      const totalHalaman = Math.ceil(produkFilter.length / perHalaman);
      document.getElementById('btn-prev').disabled = halamanAktif == 1;
      document.getElementById('btn-next').disabled = halamanAktif == totalHalaman || totalHalaman == 0;
    }

    // FUNGSI KERANJANG UDAH PAKE LOCALSTORAGE
    function tambahKeranjang(id, hargaFinal, tombol){
      const itemProduk = produk.find(p => p.id === id);
      const itemKeranjang = keranjang.find(x=>x.id === id);
      let jumlahSekarang = itemKeranjang? itemKeranjang.jumlah : 0;
      if(jumlahSekarang >= itemProduk.stok){
        showNotifAyu(`Stok ${itemProduk.nama} tinggal ${itemProduk.stok}`, 'gagal');
        return;
      }
      const img = tombol.closest('.card').querySelector('img');
      animasiTerbang(img);

      if(itemKeranjang){itemKeranjang.jumlah++}
      else{keranjang.push({...itemProduk, harga: hargaFinal, jumlah:1})}

      localStorage.setItem('keranjang_sarahmart', JSON.stringify(keranjang)); // SIMPEN NENG LOCALSTORAGE
      tombol.innerHTML = '✓ Ditambah';
      tombol.style.background = 'linear-gradient(135deg, #22c55e 0%, #15803d 100%)';
      setTimeout(()=>{tombol.innerHTML = '+ Tambah'; tombol.style.background = 'linear-gradient(135deg, #16a34a 0%, #22c55e 100%)';}, 500);
      updateKeranjangBar();
    }

    function animasiTerbang(img){
      const keranjangIcon = document.querySelector('.icon-keranjang-atas');
      const flyImg = img.cloneNode(true);
      flyImg.classList.add('fly-img');
      const rectImg = img.getBoundingClientRect();
      const rectKeranjang = keranjangIcon.getBoundingClientRect();
      flyImg.style.top = rectImg.top + 'px';
      flyImg.style.left = rectImg.left + 'px';
      document.body.appendChild(flyImg);
      setTimeout(() => {
        flyImg.style.top = rectKeranjang.top + 'px';
        flyImg.style.left = rectKeranjang.left + 'px';
        flyImg.style.width = '20px';
        flyImg.style.height = '20px';
        flyImg.style.opacity = '0.5';
      }, 50);
      setTimeout(() => {
        flyImg.remove();
        document.getElementById('jumlah-lencana').classList.add('goyang');
        setTimeout(()=>document.getElementById('jumlah-lencana').classList.remove('goyang'), 500);
      }, 850);
    }

    function updateKeranjangBar(){
      const keranjangLocal = JSON.parse(localStorage.getItem('keranjang_sarahmart')) || [];
      let totalItem = keranjangLocal.reduce((a,b)=>a+b.jumlah,0);
      document.getElementById('jumlah-lencana').innerHTML = totalItem;
      document.getElementById('jumlah-lencana').style.display = totalItem > 0? 'flex' : 'none';
    }

    function showNotifAyu(pesan, tipe = 'sukses'){
      const popup = document.getElementById('popupNotif');
      const icon = document.getElementById('icon-notif');
      const judul = document.getElementById('judul-notif');
      const pesanEl = document.getElementById('pesan-notif');
      pesanEl.innerText = pesan;
      if(tipe === 'gagal'){
        icon.innerText = '🙏';
        judul.innerText = 'Mohon maaf!';
        judul.style.color = '#d32f2f';
      } else {
        icon.innerText = '✅';
        judul.innerText = 'Sukses';
        judul.style.color = '#22c55e';
      }
      popup.style.display = 'flex';
      setTimeout(()=>{tutupNotif()}, 2500);
    }

    function tutupNotif(){document.getElementById('popupNotif').style.display = 'none';}
  </script>
</body>
</html>
